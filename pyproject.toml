[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygmu2 = ["assets/kemar/*.wav", "assets/kemar/README.md"]

[project]
name = "pygmu2"
version = "0.2.0"
description = "A framework for generating and processing digital audio"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "R. Dunbar Poor", email = "r@alum.mit.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core: what `import pygmu2` and the bread-and-butter PEs need. Heavy
# optional dependencies live in extras; the lazy-import registry defers
# them, and using a PE without its extra raises the natural ImportError.
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
# numba-accelerated filters/effects (BiquadPE, SVFilterPE, LadderPE,
# CombPE, EnvelopePE/CompressorPE, ReversePitchEchoPE)
accel = [
    "numba>=0.57.0",
]
# MIDI input and MIDI-file parsing (MidiInPE, NotesPE.get_notes_from_midi)
midi = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
]
# MP3 / FLAC / OGG decoding for AudioReaderPE
audio = [
    "miniaudio>=1.46",
]
# jog/shuttle player and annotation sidecars (scripts/jogshuttle.py)
gui = [
    "pyside6>=6.5.0",
    "pyyaml>=6.0.0",
]
# For systems with SSL certificate issues (common on macOS with python.org Python)
ssl = [
    "certifi>=2023.0.0",
]
# Google Drive OAuth support
gdrive = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.0.0",
]

[project.scripts]
# Add CLI entry points here if needed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is opt-in (pytest --cov=src), not forced on every run.

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
# Vendored third-party code is not ours to reformat
extend-exclude = 'src/pygmu2/meltysynth/'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Dependency groups (PEP 735) - used by uv
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
