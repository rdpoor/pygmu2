# Local hooks only (no network): black + flake8 on changed files.
# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        exclude: ^src/pygmu2/meltysynth/
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        exclude: ^src/pygmu2/meltysynth/
