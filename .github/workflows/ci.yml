# CI — the gates that make consumer breakage loud (DESIGN_PHILOSOPHY.md §8).
# An un-propagated rename of a public symbol must fail here; that is the
# acceptance test for the whole overhaul (philosophy §10).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sounddevice's Linux wheel is pure Python and needs the system
      # PortAudio library (the macOS/Windows wheels bundle it).
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # All extras: the test suite covers the numba/midi/audio PEs too
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check (black)
        run: uv run black --check src tests examples benchmarks scripts

      - name: Lint (flake8 — correctness codes; policy in .flake8)
        run: uv run flake8 src tests examples benchmarks scripts

      - name: Types (mypy ratchet — core contract files)
        run: >
          uv run mypy src/pygmu2/processing_element.py src/pygmu2/snippet.py
          src/pygmu2/extent.py src/pygmu2/renderer.py src/pygmu2/config.py
          src/pygmu2/diagnostics.py

      - name: Test suite (unit + examples smoke + boundary gates)
        run: |
          set -o pipefail
          uv run pytest -x -q 2>&1 | tee pytest.log || {
            echo "::error title=pytest::$(tail -c 900 pytest.log | tr '\n' '¶')"
            exit 1
          }
